<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdoptaMe</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Navbar -->
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="#inicio" aria-label="AdoptaMe, inicio">
        <img src="images/logo-adoptame.png" alt="AdoptaMe">
      </a>
      <nav>
        <a href="#inicio">Inicio</a>
        <a href="#ayuda">Ayuda</a>
      </nav>
    </div>
  </header>

  <!-- Banner (solo la imagen) -->
  <section class="banner" id="inicio">
    <img src="images/banner-ayuda.jpg" alt="Luchamos por quienes no tienen voz">
  </section>

  <!-- Ayuda: imagen + WhatsApp -->
  <section class="split" id="ayuda">
    <div class="container">

      <h2 class="help-title">Ayuda</h2>

      <div class="split-grid">

        <div class="split-image">
          <img src="images/cuerpo_web.jpg" alt="Voluntarios paseando perritos">
        </div>

        <div class="split-text help">
          <h2>Contáctanos</h2>
          <h3>Hablemos por WhatsApp</h3>
          <p>Nuestro asistente virtual está disponible siempre. Nuestro equipo atiende de lunes a sábados de 09:00 am a 07:00 pm.</p>
          <a class="btn btn-whatsapp" href="https://wa.me/51938735082" target="_blank" rel="noopener">Iniciar WhatsApp</a>
        </div>

      </div>
    </div>
  </section>

  <!-- Pie de página -->
  <footer class="site-footer">
    <div class="container footer-inner">

      <p>¡Sigue nuestra labor en nuestras redes sociales!</p>

      <div class="social">
        <a href="https://x.com/TU_USUARIO" target="_blank" rel="noopener" aria-label="X">
          <img src="images/x.png" alt="X">
        </a>
        <a href="https://facebook.com/TU_PAGINA" target="_blank" rel="noopener" aria-label="Facebook">
          <img src="images/facebook.png" alt="Facebook">
        </a>
        <a href="https://instagram.com/TU_USUARIO" target="_blank" rel="noopener" aria-label="Instagram">
          <img src="images/instagram.png" alt="Instagram">
        </a>
      </div>

    </div>
  </footer>

</body>
</html>
